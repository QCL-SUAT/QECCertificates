name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The static gates come first: they cost seconds, and they are the ones that
      # a fresh clone can fail for reasons that have nothing to do with Lean -- a
      # machine-coupled path, a control byte folded into a source file, the two
      # READMEs drifting, a theorem whose audit line was forgotten.  Each runs its
      # own self-test too, because a gate that only ever printed PASS is an
      # assumption.
      - name: Portability gate
        run: |
          python3 tools/check_portability.py --self-test
          python3 tools/check_portability.py

      - name: README pair gate
        run: |
          python3 tools/check_readme_pair.py --self-test
          python3 tools/check_readme_pair.py

      - name: Audit-coverage gate
        run: |
          python3 tools/check_audit_coverage.py --self-test
          python3 tools/check_audit_coverage.py

      - name: CI scope gate
        run: |
          python3 tools/ci_scope.py --self-test
          python3 tools/ci_scope.py --check

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the prebuilt caches (mathlib, and the two upstream libraries)
        run: |
          lake exe cache get
          # Best effort, and deliberately not fatal.  The two upstream libraries ship
          # prebuilt olean trees on a `build-cache` branch; replaying them is the
          # difference between a job that finishes and one that compiles ten thousand
          # modules from source and runs into the six-hour limit.  If a branch has
          # moved or the fetch fails, the loop says so and the build below compiles
          # them instead, which is where we were before this step existed.
          env -u LEAN_PATH lake build --no-build >/dev/null 2>&1 || true
          for spec in "LeanQEC QCL-SUAT/Lean-QEC" "QEC QCL-SUAT/QECLean"; do
            set -- $spec
            dir=".lake/packages/$1"
            if [ ! -e "$dir/.git" ]; then
              echo "no checkout for $1 yet, skipping its cache"
              continue
            fi
            if git -C "$dir" fetch --depth 1 origin build-cache \
               && git -C "$dir" checkout --quiet FETCH_HEAD -- .lake; then
              n=$(find "$dir/.lake/build/lib/lean" -name '*.olean' 2>/dev/null | wc -l)
              echo "replayed the prebuilt cache of $1: $n olean(s) in place"
            else
              echo "cache replay skipped for $1 (branch unreachable or moved)"
            fi
          done

      # The modules that a hosted runner can afford, and no others.  One of this
      # library's modules closes its statement by kernel reduction over a large
      # object and peaks near 45 GB, so a job that asks for the whole library dies at
      # the tail with a killed process and no error of ours to show.  The scope is
      # measured, recorded and gated by tools/ci_scope.py; the README states what it
      # leaves out, and the log of every run repeats it.
      - name: Build the modules in scope (0 error, 0 warning in this package)
        run: |
          set -o pipefail
          python3 tools/ci_scope.py
          targets=$(python3 tools/ci_scope.py --lake-targets)
          echo "building $(echo "$targets" | wc -l) module(s) of 56"
          if ! env -u LEAN_PATH lake build $targets 2>&1 | tee build.log; then
            echo "::group::the tail of the build log"
            tail -60 build.log
            echo "::endgroup::"
            # A failure has to say what it was in the checks view: reading a log is
            # a download away, and a failure that needs one is a failure nobody acts
            # on.  The first error line goes into the annotation.
            msg=$(grep -m1 -E 'error[(:]' build.log | tr -d '\r' | cut -c1-400 \
                  | sed 's/%/%25/g')
            echo "::error title=the build failed::${msg:-no error line in build.log}"
            exit 1
          fi
          errs=$(grep -cE 'error[(:]' build.log || true)
          # A warning counts against this package only when it names a file of it.
          # The dependencies warn too -- deprecation notices, aesop on a goal it
          # cannot close -- and on the runner their paths sit under a directory called
          # QECCertificates, so matching a bare "QECCertificates/" counts them.
          warns=$(grep -E '^warning: (QECCertificates\.lean|QECCertificates/)' build.log | wc -l)
          echo "error lines: $errs (want 0)"
          echo "package warning lines: $warns (want 0)"
          if [ "$warns" != "0" ]; then
            grep -E '^warning: (QECCertificates\.lean|QECCertificates/)' build.log
          fi
          test "$errs" = "0"
          test "$warns" = "0"

      # The audit region lives in the root module, and the root module imports the
      # whole library, so this step runs when -- and only when -- the scope above
      # reaches it.  Saying so is the point: a badge that hid the difference between
      # "audited here" and "audited elsewhere" would be the wrong kind of green.
      - name: Axiom audit, when the scope covers the audit region
        run: |
          if python3 tools/ci_scope.py --lake-targets | grep -qxF 'QECCertificates'; then
            python3 tools/check_axioms.py build.log
          else
            echo "Not run in this job.  The audit region is the root module, which"
            echo "imports the whole library; the modules outside this runner's memory"
            echo "budget are listed by tools/ci_scope.py.  Build the library on a"
            echo "machine with the memory the README asks for and run the audit there:"
            echo "  env -u LEAN_PATH lake build > build.log 2>&1"
            echo "  python3 tools/check_axioms.py build.log"
          fi
