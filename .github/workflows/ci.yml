name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the prebuilt mathlib cache
        run: lake exe cache get

      - name: Build (0 error, 0 warning in this package)
        run: |
          set -o pipefail
          env -u LEAN_PATH lake build 2>&1 | tee build.log
          errs=$(grep -cE 'error[(:]' build.log || true)
          warns=$(grep 'warning:' build.log | grep -c 'QECCertificates/' || true)
          echo "error lines: $errs (want 0)"
          echo "package warning lines: $warns (want 0)"
          test "$errs" = "0"
          test "$warns" = "0"

      - name: Axiom audit (three standard axioms only)
        run: python3 tools/check_axioms.py build.log
