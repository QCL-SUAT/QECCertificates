name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the prebuilt caches (mathlib, and the two upstream libraries)
        run: |
          lake exe cache get
          # Best effort, and deliberately not fatal.  The two upstream libraries ship
          # prebuilt olean trees on a `build-cache` branch; replaying them is the
          # difference between a job that finishes and one that compiles ten thousand
          # modules from source and runs into the six-hour limit.  If a branch has
          # moved or the fetch fails, the loop says so and the build below compiles
          # them instead, which is where we were before this step existed.
          env -u LEAN_PATH lake build --no-build >/dev/null 2>&1 || true
          for spec in "LeanQEC QCL-SUAT/Lean-QEC" "QEC QCL-SUAT/QECLean"; do
            set -- $spec
            dir=".lake/packages/$1"
            if [ ! -e "$dir/.git" ]; then
              echo "no checkout for $1 yet, skipping its cache"
              continue
            fi
            if git -C "$dir" fetch --depth 1 origin build-cache \
               && git -C "$dir" checkout --quiet FETCH_HEAD -- .lake; then
              echo "replayed the prebuilt cache of $1"
            else
              echo "cache replay skipped for $1 (branch unreachable or moved)"
            fi
          done

      - name: Build (0 error, 0 warning in this package)
        run: |
          set -o pipefail
          if ! env -u LEAN_PATH lake build 2>&1 | tee build.log; then
            echo "::group::the tail of the build log"
            tail -60 build.log
            echo "::endgroup::"
            exit 1
          fi
          errs=$(grep -cE 'error[(:]' build.log || true)
          # A warning counts against this package only when it names a file of it.
          # The dependencies warn too -- deprecation notices, aesop on a goal it
          # cannot close -- and on the runner their paths sit under a directory called
          # QECCertificates, so matching a bare "QECCertificates/" counts them.
          warns=$(grep -E '^warning: (QECCertificates\.lean|QECCertificates/)' build.log | wc -l)
          echo "error lines: $errs (want 0)"
          echo "package warning lines: $warns (want 0)"
          if [ "$warns" != "0" ]; then
            grep -E '^warning: (QECCertificates\.lean|QECCertificates/)' build.log
          fi
          test "$errs" = "0"
          test "$warns" = "0"

      - name: Axiom audit (three standard axioms only)
        run: python3 tools/check_axioms.py build.log

      # Portability first, before the build: it is the one gate that a fresh clone
      # can fail for reasons that have nothing to do with Lean -- a machine-coupled
      # path, a tracked file missing from the checkout, a control byte folded into a
      # source file.  Its own self-test runs too, because a gate that only ever
      # printed PASS is an assumption.
      - name: Portability gate
        run: |
          python3 tools/check_portability.py --self-test
          python3 tools/check_portability.py

      # The two READMEs are one document in two languages; the repository shows the
      # English one and links the Chinese one, which is only worth doing while they
      # say the same thing section for section.
      - name: README pair gate
        run: |
          python3 tools/check_readme_pair.py --self-test
          python3 tools/check_readme_pair.py
