name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The static gates come first: they cost seconds, and they are the ones that
      # a fresh clone can fail for reasons that have nothing to do with Lean -- a
      # machine-coupled path, a control byte folded into a source file, the two
      # READMEs drifting, a theorem whose audit line was forgotten.  Each runs its
      # own self-test too, because a gate that only ever printed PASS is an
      # assumption.
      - name: Portability gate
        run: |
          python3 tools/check_portability.py --self-test
          python3 tools/check_portability.py

      - name: README pair gate
        run: |
          python3 tools/check_readme_pair.py --self-test
          python3 tools/check_readme_pair.py

      - name: Audit-coverage gate
        run: |
          python3 tools/check_audit_coverage.py --self-test
          python3 tools/check_audit_coverage.py

      - name: CI scope gate
        run: |
          python3 tools/ci_scope.py --self-test
          python3 tools/ci_scope.py --check

      # A failing step has to say why, and the only channel that carries a reason
      # to the checks view is an annotation.  The job log does not count: reading it
      # from outside needs repository admin rights, so a reason that lives only in
      # the log is a reason nobody outside can act on.  Every step below that can
      # fail ends with `|| fail <title> <log>`, which prints the tail, annotates the
      # first error line, and exits 1.
      - name: A helper that turns a failure into an annotation
        run: |
          cat > "$RUNNER_TEMP/fail.sh" <<'SH'
          fail() {
            title="$1"; log="$2"
            echo "::group::the tail of $(basename "$log")"
            tail -40 "$log" 2>/dev/null || true
            echo "::endgroup::"
            msg=$(grep -m1 -E 'error[(:]|fatal:|Error:|Cannot|cannot|No space|space left|uncaught' \
                  "$log" 2>/dev/null | tr -d '\r' | cut -c1-400 | sed 's/%/%25/g')
            # A failure that matches no known pattern still has to say something,
            # so the last lines of the log travel in the annotation itself: the
            # checks view is the only place a reader outside this repository can
            # look, and a dead process often leaves no line that looks like an error.
            tail3=$(tail -3 "$log" 2>/dev/null | tr -d '\r' | tr '\n' '|' | cut -c1-350 | sed 's/%/%25/g')
            echo "::error title=${title}::${msg:-no line matches an error pattern}; last lines: ${tail3}"
            exit 1
          }
          SH
          echo "the helper is in $RUNNER_TEMP/fail.sh"

      - name: Install elan (Lean toolchain manager)
        run: |
          source "$RUNNER_TEMP/fail.sh"
          { curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none; } > "$RUNNER_TEMP/elan.log" 2>&1 \
            || fail "installing elan failed" "$RUNNER_TEMP/elan.log"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tail -3 "$RUNNER_TEMP/elan.log"

      # Its own step, because the toolchain download is the first thing that touches
      # the network and the first thing that can fail for a reason that is nobody's
      # mistake -- a release page that is slow, a runner without disk.
      - name: Resolve the Lean toolchain named by lean-toolchain
        run: |
          source "$RUNNER_TEMP/fail.sh"
          echo "lean-toolchain asks for: $(cat lean-toolchain)"
          lake --version > "$RUNNER_TEMP/toolchain.log" 2>&1 \
            || fail "the Lean toolchain could not be resolved" "$RUNNER_TEMP/toolchain.log"
          cat "$RUNNER_TEMP/toolchain.log"

      # The mathlib oleans come from the project's cache server; the two upstream
      # libraries ship theirs on a `build-cache` branch.  Replaying them is the
      # difference between a job that finishes and one that compiles ten thousand
      # modules from source and runs into the six-hour limit.  The replay is best
      # effort and says so out loud, because whether it worked is the first thing
      # worth knowing about a failing run.
      - name: Fetch the prebuilt caches (mathlib, and the two upstream libraries)
        run: |
          source "$RUNNER_TEMP/fail.sh"
          echo "disk before the cache download:"
          df -h / "$HOME" /mnt 2>/dev/null | sed 's/^/  /'
          # The cache program keeps one archive per module under ~/.cache/mathlib and
          # unpacks it into the mathlib checkout, so the download and the unpacked
          # oleans both compete for the same small root filesystem.  The runner has a
          # large second disk at /mnt: put the archives there, and they stop counting
          # against the space the unpacked oleans need.
          if sudo -n mkdir -p /mnt/mathlib-cache && sudo -n chown "$USER" /mnt/mathlib-cache; then
            rm -rf "$HOME/.cache/mathlib"
            mkdir -p "$HOME/.cache"
            ln -s /mnt/mathlib-cache "$HOME/.cache/mathlib"
            echo "the archive cache lives on /mnt"
          else
            echo "no writable /mnt; the archives stay under \$HOME"
          fi
          ok=0
          for attempt in 1 2 3; do
            if lake exe cache get > "$RUNNER_TEMP/cache.log" 2>&1; then ok=1; break; fi
            echo "attempt $attempt of the mathlib cache download failed; the last lines:"
            tail -5 "$RUNNER_TEMP/cache.log"
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "disk after the failed download:"
            df -h / "$HOME" /mnt 2>/dev/null | sed 's/^/  /'
            fail "fetching the mathlib cache failed" "$RUNNER_TEMP/cache.log"
          fi
          df -h / "$HOME" | sed 's/^/disk: /'
          mathlib=$(find .lake/packages/mathlib/.lake/build/lib/lean -name '*.olean' 2>/dev/null | wc -l)
          echo "mathlib oleans in place: $mathlib"
          echo "::notice title=mathlib cache::$mathlib olean(s) in place"
          # The archives have done their work; the build below needs the room.  A
          # second `cache get` in the same job would re-download them, and there is
          # no second call.
          rm -rf "$HOME/.cache/mathlib"
          df -h / "$HOME" | sed 's/^/disk: /'
          env -u LEAN_PATH lake build --no-build >/dev/null 2>&1 || true
          for spec in "LeanQEC QCL-SUAT/Lean-QEC" "QEC QCL-SUAT/QECLean"; do
            set -- $spec
            dir=".lake/packages/$1"
            if [ ! -e "$dir/.git" ]; then
              echo "no checkout for $1 yet, skipping its cache"
              echo "::warning title=$1 cache::no checkout, so its modules compile from source"
              continue
            fi
            if git -C "$dir" fetch --depth 1 origin build-cache >/dev/null 2>&1 \
               && git -C "$dir" checkout --quiet FETCH_HEAD -- .lake; then
              n=$(find "$dir/.lake/build/lib/lean" -name '*.olean' 2>/dev/null | wc -l)
              echo "replayed the prebuilt cache of $1: $n olean(s) in place"
              echo "::notice title=$1 cache::$n olean(s) in place"
            else
              echo "cache replay skipped for $1 (branch unreachable or moved)"
              echo "::warning title=$1 cache::the build-cache branch is unreachable, so its modules compile from source"
            fi
          done

      # The modules that a hosted runner can afford, and no others.  One of this
      # library's modules closes its statement by kernel reduction over a large
      # object and peaks near 45 GB, so a job that asks for the whole library dies at
      # the tail with a killed process and no error of ours to show.  The scope is
      # measured, recorded and gated by tools/ci_scope.py; the README states what it
      # leaves out, and the log of every run repeats it.
      - name: Build the modules in scope (0 error, 0 warning in this package)
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/fail.sh"
          python3 tools/ci_scope.py
          targets=$(python3 tools/ci_scope.py --lake-targets)
          echo "building $(echo "$targets" | wc -l) module(s) of 56"
          if ! env -u LEAN_PATH lake build $targets 2>&1 | tee build.log; then
            echo "::warning title=the build was interrupted::the process died without an error line of ours. A death by memory shows up in dmesg, not in the log."
            fail "the build failed" build.log
          fi
          errs=$(grep -cE 'error[(:]' build.log || true)
          # A warning counts against this package only when it names a file of it.
          # The dependencies warn too -- deprecation notices, aesop on a goal it
          # cannot close -- and on the runner their paths sit under a directory called
          # QECCertificates, so matching a bare "QECCertificates/" counts them.
          warns=$(grep -E '^warning: (QECCertificates\.lean|QECCertificates/)' build.log | wc -l)
          echo "error lines: $errs (want 0)"
          echo "package warning lines: $warns (want 0)"
          if [ "$warns" != "0" ]; then
            grep -E '^warning: (QECCertificates\.lean|QECCertificates/)' build.log
          fi
          test "$errs" = "0"
          test "$warns" = "0"

      # The audit region lives in the root module, and the root module imports the
      # whole library, so this step runs when -- and only when -- the scope above
      # reaches it.  Saying so is the point: a badge that hid the difference between
      # "audited here" and "audited elsewhere" would be the wrong kind of green.
      - name: Axiom audit, when the scope covers the audit region
        run: |
          source "$RUNNER_TEMP/fail.sh"
          if python3 tools/ci_scope.py --lake-targets | grep -qxF 'QECCertificates'; then
            python3 tools/check_axioms.py build.log > "$RUNNER_TEMP/audit.log" 2>&1 \
              || fail "the axiom audit failed" "$RUNNER_TEMP/audit.log"
            tail -5 "$RUNNER_TEMP/audit.log"
          else
            echo "Not run in this job.  The audit region is the root module, which"
            echo "imports the whole library; the modules outside this runner's memory"
            echo "budget are listed by tools/ci_scope.py.  Build the library on a"
            echo "machine with the memory the README asks for and run the audit there:"
            echo "  env -u LEAN_PATH lake build > build.log 2>&1"
            echo "  python3 tools/check_axioms.py build.log"
          fi
